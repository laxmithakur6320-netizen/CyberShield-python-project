<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }

        a {
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Password Strength Checker</h1>
        <p>Check how strong your password is.</p>

        <input type="password" id="password"
               placeholder="Enter a test password">

        <br>

        <button onclick="checkPassword()">Check Strength</button>

        <div id="result"></div>

        <p><a href="/">← Back to Home</a></p>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("password").value;
            const result = document.getElementById("result");

            if (password.length === 0) {
                result.textContent = "Please enter a password.";
                return;
            }

            let score = 0;

            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            if (score <= 2) {
                result.textContent = "🔴 Weak Password";
            } else if (score <= 4) {
                result.textContent = "🟡 Medium Password";
            } else {
                result.textContent = "🟢 Strong Password";
            }
        }
    </script>
</body>
</html>
