<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Report - Cyber Shield</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #38bdf8;
            text-align: center;
        }

        p {
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            color: #4ade80;
            text-align: center;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Request a Security Report</h1>
        <p>Submit a sample security issue report.</p>

        <form id="reportForm">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="issue">Issue Type</label>
            <select id="issue" required>
                <option value="">Select an issue</option>
                <option value="Password Security">Password Security</option>
                <option value="Suspicious Login">Suspicious Login</option>
                <option value="Website Security">Website Security</option>
                <option value="Other">Other</option>
            </select>

            <label for="description">Issue Description</label>
            <textarea id="description"
                placeholder="Describe the security issue..."
                required></textarea>

            <button type="submit">Submit Report</button>
        </form>

        <p id="message"></p>

        <p><a href="/">← Back to Home</a></p>
    </div>

    <script>
        document.getElementById("reportForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Demo report submitted successfully!";

            this.reset();
        });
    </script>
</body>
</html>
